[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "validkit"
version = "0.1.0"
description = "Kleine, rein auf der Python-Standardbibliothek basierende Bibliothek mit Prüf- und Normalisierungsfunktionen."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0,<9.0"]

[tool.setuptools.packages.find]
include = ["validkit*"]
